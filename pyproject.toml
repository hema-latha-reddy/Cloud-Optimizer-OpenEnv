[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-optimizer-env"
version = "2.0.0"
description = "Cloud server auto-scaling environment for AI agents"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "openenv>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/Cloud-Optimizer-OpenEnv"
Repository = "https://github.com/YOUR_USERNAME/Cloud-Optimizer-OpenEnv.git"
Documentation = "https://github.com/YOUR_USERNAME/Cloud-Optimizer-OpenEnv#readme"

[tool.setuptools.packages.find]
include = ["cloud_server*", "server*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
cloud_server = ["templates/*", "static/*", "*.yaml"]